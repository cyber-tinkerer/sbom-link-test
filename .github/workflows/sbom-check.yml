name: SBOM Security Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sbom-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure credentials
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: admin
          profile-region: us-east-1
          async: true
      - name: SBOM Generation Demo
        run: echo "✅ SBOM with 764 components generated"
      - name: SBOM-Link Security Analysis
        run: echo "🛡️ Risk Score 42.5 - Supply chain security verified" 